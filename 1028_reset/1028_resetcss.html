<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="reset.css">
    <style>
        body{
            height: 5000px;
        }
        .quickmenu{
            position: absolute;
            right: 50px;
            width: 100px;
            height: 300px;
            background: #ccc;
            top: 200px;
        }
    </style>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>    
    <script>
        $(function(){
            $(window).scroll(function(){
                let scrtop = $(document).scrollTop();
                console.log(scrtop);
                if(scrtop > 0){
                    $(".quickmenu")
                    .stop()
                    .animate({top:scrtop + 200 +"px"}, 500);
                }
            });
        });
    </script>
</head>
<body>
    <div class="quickmenu"></div>
    <iframe src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d1606.7429150082326!2d127.37655468875785!3d36.3490094290391!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x35654be14ac762f3%3A0xeb905080ab28e9bf!2z7Jik65287YG0QkQ!5e0!3m2!1sko!2skr!4v1730101241036!5m2!1sko!2skr" width="500" height="500" style="border:0;" allowfullscreen="" loading="lazy" referrerpolicy="no-referrer-when-downgrade"></iframe>
    <!-- 구글맵에서 장소 공유하기 지도퍼가기 HTML복사 복붙-->
</body>
</html>
